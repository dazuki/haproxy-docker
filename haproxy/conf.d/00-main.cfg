# Shared config and the :443 frontend. Loaded first (lexical order), then
# services/*.cfg. HTTPS only: nothing listens on :80. Missing ssl/*.pem or
# acl/*.lst is fatal at start (fail closed).

global
    log stdout format raw local0
    # Container runs as root so the master can read 600 keys and bind 443;
    # workers drop to this user.
    user haproxy
    group haproxy
    chroot /var/empty
    maxconn 4096

    # Mozilla "intermediate": TLS 1.2 limited to ECDHE + AEAD, TLS 1.3 suites.
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    # Session tickets reuse one key across sessions, weakening forward secrecy.
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    # GDPR: client IP masked to /24 (IPv4) or /48 (IPv6), path logged without
    # query string (may carry tokens/PII). Otherwise the default httplog format.
    log-format "%[src,ipmask(24,48)] [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq \"%HM %HPO %HV\""
    timeout connect 10s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    timeout http-keep-alive 10s
    # Resolve upstreams via podman DNS at runtime instead of at load: a stopped
    # container gives 503 for its path instead of blocking start/reload.
    default-server init-addr last,libc,none resolvers default

crt-store
    crt-base /etc/haproxy/ssl
    key-base /etc/haproxy/ssl
    # { cat <leaf>.crt; echo; cat <intermediate>.crt; } > haproxy/ssl/fullchain.pem
    load crt fullchain.pem key privkey.pem alias site

# Container-internal, for the compose healthcheck only (not published).
frontend healthz
    bind 127.0.0.1:8405
    http-request set-log-level silent
    http-request return status 200 content-type text/plain string "ok\n"

frontend https
    bind :443 ssl crt @/site
    maxconn 2000
    stick-table type ipv6 size 100k expire 10m store conn_cur,http_req_rate(10s)

    # Before the TLS handshake: unlisted sources get no session and no log line.
    tcp-request connection reject unless { src -f /etc/haproxy/acl/allow-src.lst }
    tcp-request connection track-sc0 src
    # Generous: one source can be a whole NAT or the AI platform backend serving every
    # user. Stops one client exhausting maxconn (MCP streams live up to 24h).
    tcp-request connection reject if { sc0_conn_cur gt 200 }

    # Only our own hostname (no direct-IP or foreign Host).
    http-request reject unless { req.hdr(host),host_only -i -f /etc/haproxy/acl/allow-host.lst }
    # Browsers send Origin cross-site; MCP spec wants 403 for unknown ones (DNS
    # rebinding). Server-side clients (AI platform backend) send none and pass.
    http-request deny deny_status 403 if { req.hdr(origin) -m found } !{ req.hdr(origin) -i -f /etc/haproxy/acl/allow-origin.lst }
    http-request deny deny_status 429 if { sc0_http_req_rate gt 500 }
    # Chunked bodies have no Content-Length and bypass this; upstreams must cap too.
    http-request deny deny_status 413 if { req.hdr_val(content-length) gt 10485760 }

    # Client-supplied forwarding headers are spoofable: drop, then set our own.
    # IPs sent upstream are masked like the logs.
    http-request del-header Forwarded
    http-request del-header X-Forwarded- -m beg
    http-request set-header X-Forwarded-For %[src,ipmask(24,48)]
    http-request set-header X-Real-IP %[src,ipmask(24,48)]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(host)]

    http-response del-header Server
    http-response del-header X-Powered-By
    # after-response: also covers HAProxy's own 403/413/429/503 replies. No
    # includeSubDomains/preload: must not affect the rest of *.domain.se.
    http-after-response set-header Strict-Transport-Security "max-age=31536000"
    http-after-response set-header X-Content-Type-Options nosniff
    http-after-response set-header Referrer-Policy no-referrer

    # /webservice/... -> backend svc_webservice, if a services/*.cfg defines it.
    # The svc_ prefix keeps other backends unreachable from the URL.
    use_backend svc_%[path,field(2,/)]
    default_backend drop

# Unmatched path: close the connection without a response.
backend drop
    http-request reject
